<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Productos del Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Productos del Pedido</h1>
  <h3 th:text="'Pedido: ' + ${pedido.descripcion}"></h3>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Peso</th>
      <th>Stock</th>
      <th>Categoría</th>
      <th>Accion</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="producto : ${productos}">
      <td th:text="${producto.nombre}"></td>
      <td th:text="${producto.descripcion}"></td>
      <td th:text="${producto.peso}"></td>
      <td th:text="${producto.stock}"></td>
      <td th:text="${producto.categoria.nombre}"></td>
      <td>
        <form th:action="@{/producto/{id}/categorias(id=${producto.id})}" method="post">

          <input type="hidden" name="pedidoId" th:value="${pedido.id}" />

          <button type="submit" class="btn btn-info btn-sm">Ver Categoria</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <a href="/pedidos" class="btn btn-secondary">Ver todos los pedidos</a>
  <a th:href="@{/clientes/{id}/pedidos(id=${pedido.cliente.id})}" class="btn btn-secondary">Volver a los pedidos</a>
</div>
</body>
</html>
